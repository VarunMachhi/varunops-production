{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#f5f5f7">
  <title>VarunOps Employee</title>
  <link rel="stylesheet" href="{% static 'core/css/workspace.css' %}">
</head>
<body class="app-body employee-theme">
  <div class="app-shell employee-shell">
    <aside class="sidebar glass">
      <a class="brand" href="{% url 'landing' %}"><span class="brand-dot">V</span><span><b>VarunOps</b><small>Employee</small></span></a>
      <nav class="side-nav">
        <button class="nav-item active" data-view="home"><span>⌂</span>Home</button>
        <button class="nav-item" data-view="device"><span>▣</span>My PC</button>
        <button class="nav-item" data-view="software"><span>▦</span>Software</button>
        <button class="nav-item" data-view="support"><span>✦</span>Support <i id="employeeTicketBadge">0</i></button>
        <button class="nav-item" data-view="notifications"><span>◉</span>Notifications <i id="employeeNoticeBadge">0</i></button>
        <button class="nav-item" data-view="profile"><span>⌘</span>Profile</button>
      </nav>
      <div class="side-foot">
        <div class="privacy-line">Only your assigned PC and your requests are visible here.</div>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="ghost-btn full" type="submit">Sign out</button></form>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar glass">
        <div><small id="employeeEyebrow">My workspace</small><h1 id="employeeTitle">Home</h1><p id="employeeSubtitle">Your device, software and IT help.</p></div>
        <div class="top-actions"><button class="icon-btn" id="employeeRefresh">↻</button><div class="avatar">{{ request.user.username|slice:':1'|upper }}</div></div>
      </header>
      <section class="page" id="employeeContent"><div class="loading"><i></i><span>Loading your workspace…</span></div></section>
    </main>
  </div>
  <div class="toast" id="employeeToast"></div>
  <div class="modal-wrap" id="employeeModal" hidden><div class="modal-card glass"><button class="modal-close" id="employeeModalClose">×</button><div id="employeeModalContent"></div></div></div>
  <script src="{% static 'core/js/employee_v2.js' %}" defer></script>
</body>
</html>
