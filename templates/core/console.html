{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#f5f5f7">
  <title>VarunOps Admin</title>
  <link rel="stylesheet" href="{% static 'core/css/workspace.css' %}">
</head>
<body class="app-body">
  <div class="app-shell">
    <aside class="sidebar glass">
      <a class="brand" href="{% url 'landing' %}"><span class="brand-dot">V</span><span><b>VarunOps</b><small>Admin</small></span></a>
      <nav class="side-nav" id="sideNav">
        <button class="nav-item active" data-view="overview"><span>⌂</span>Overview</button>
        <button class="nav-item" data-view="devices"><span>▣</span>Devices</button>
        <button class="nav-item" data-view="employees"><span>◉</span>Employees</button>
        <button class="nav-item" data-view="software"><span>▦</span>Software</button>
        <button class="nav-item" data-view="requests"><span>⚠</span>Requests <i id="requestBadge">0</i></button>
        <button class="nav-item" data-view="policies"><span>◎</span>Policies</button>
        <button class="nav-item" data-view="support"><span>✦</span>Support <i id="ticketBadge">0</i></button>
        <button class="nav-item" data-view="activity"><span>◷</span>Activity</button>
      </nav>
      <div class="side-foot">
        <div class="sync"><i></i><span><b>Connected</b><small id="syncStamp">Loading…</small></span></div>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="ghost-btn full" type="submit">Sign out</button></form>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar glass">
        <div><small id="viewEyebrow">Workspace</small><h1 id="viewTitle">Overview</h1><p id="viewSubtitle">Company IT at a glance.</p></div>
        <div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search"></label><button class="icon-btn" id="refreshData" title="Refresh">↻</button><div class="avatar">{{ request.user.username|slice:':1'|upper }}</div></div>
      </header>
      <section class="page" id="consoleContent"><div class="loading"><i></i><span>Loading VarunOps…</span></div></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-wrap" id="appModal" hidden><div class="modal-card glass"><button class="modal-close" id="modalClose">×</button><div id="modalContent"></div></div></div>
  <script src="{% static 'core/js/console_v2.js' %}" defer></script>
</body>
</html>
